server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://postgres:5432/htask_auth
    username: htask
    password: htask123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: htask-super-secret-key-for-jwt-token-generation-minimum-256-bits
  expiration: 86400000 # 24 hours

logging:
  level:
    com.htask: DEBUG
