version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: htask-postgres
    environment:
      POSTGRES_USER: htask
      POSTGRES_PASSWORD: htask123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - htask-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U htask"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: htask-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/htask_auth
      SPRING_DATASOURCE_USERNAME: htask
      SPRING_DATASOURCE_PASSWORD: htask123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - htask-network

  # User Service
  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: htask-user-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/htask_users
      SPRING_DATASOURCE_USERNAME: htask
      SPRING_DATASOURCE_PASSWORD: htask123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - htask-network

  # Project Service
  project-service:
    build:
      context: ./backend/project-service
      dockerfile: Dockerfile
    container_name: htask-project-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/htask_projects
      SPRING_DATASOURCE_USERNAME: htask
      SPRING_DATASOURCE_PASSWORD: htask123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - htask-network

  # Task Service
  task-service:
    build:
      context: ./backend/task-service
      dockerfile: Dockerfile
    container_name: htask-task-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/htask_tasks
      SPRING_DATASOURCE_USERNAME: htask
      SPRING_DATASOURCE_PASSWORD: htask123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - htask-network

  # API Gateway
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: htask-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - user-service
      - project-service
      - task-service
    networks:
      - htask-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: htask-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - htask-network

networks:
  htask-network:
    driver: bridge

volumes:
  postgres_data:
